[project]
name = "conformscope"
version = "0.1.0"
description = "Can a wheelchair live in this home? PMR accessibility checks on building plans with Meta models."
authors = [
    { name = "Azizomezine", email = "azizomezine6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
conformscope-spike = "conformscope.spike:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
